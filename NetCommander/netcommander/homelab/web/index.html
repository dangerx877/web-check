<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Funk</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card" autocomplete="on">
      <h1><span class="logo" aria-hidden="true">◆</span> Uptime Funk</h1>
      <p class="muted">Homelab &amp; infrastructure management · <i>Don't believe me, just watch.</i></p>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <label>Authenticator code<input name="otp" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456 or a recovery code"></label>
      <button type="submit" class="primary">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo" aria-hidden="true">◆</span> Uptime Funk</div>
      <nav id="nav" aria-label="Modules"></nav>
      <div class="sidebar-foot">
        <div id="who" class="muted small"></div>
        <button id="theme-btn" class="ghost small" type="button">Toggle theme</button>
        <button id="logout-btn" class="ghost small" type="button">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="ghost menu-btn" type="button" aria-label="Menu">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <div class="spacer"></div>
        <input id="global-search" type="search" placeholder="Search inventory…" aria-label="Search inventory">
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <menu class="modal-actions">
        <button value="cancel" type="button" id="modal-cancel" class="ghost">Cancel</button>
        <button value="ok" type="submit" id="modal-ok" class="primary">OK</button>
      </menu>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
