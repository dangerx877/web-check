# TLS reverse proxy in front of `netcommander serve` (bound to 127.0.0.1:8765).
server {
    listen 443 ssl;
    server_name netcommander.example.lan;
    ssl_certificate     /etc/ssl/netcommander/fullchain.pem;
    ssl_certificate_key /etc/ssl/netcommander/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;               # required: the CSRF check compares Origin with Host
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
