name: Release builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -e ".[build,dev]"
      - run: python -m pytest -m "not display" -q
      - run: pyinstaller packaging/netcommander.spec
      - uses: actions/upload-artifact@v4
        with:
          name: NetCommander-${{ runner.os }}
          path: dist/
